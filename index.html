<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fonte Zomboid</title>
<meta name="description" content="Objets fondables a la forge dans Project Zomboid B42, par metal et par taille.">
<style>
:root{
  --bg:#f6f5f2; --panel:#fff; --line:#e0ddd6; --ink:#1d1b17; --dim:#6d675d;
  --iron:#7a8794; --steel:#b08445; --accent:#8c4a2f; --shadow:0 1px 2px rgba(0,0,0,.06);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#14130f; --panel:#1d1c17; --line:#33302a; --ink:#ece8e0; --dim:#98918a;
  --iron:#8fa0b0; --steel:#d0a05c; --accent:#d98e6a; --shadow:0 1px 2px rgba(0,0,0,.4);
}}
:root[data-theme="dark"]{
  --bg:#14130f; --panel:#1d1c17; --line:#33302a; --ink:#ece8e0; --dim:#98918a;
  --iron:#8fa0b0; --steel:#d0a05c; --accent:#d98e6a; --shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px 64px}
header{position:sticky;top:0;z-index:10;background:var(--bg);
  border-bottom:1px solid var(--line);padding:18px 0 12px;margin-bottom:20px}
h1{margin:0 0 2px;font-size:20px;letter-spacing:-.01em}
.sub{margin:0 0 14px;color:var(--dim);font-size:13px}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input[type=search]{flex:1 1 240px;min-width:0;padding:9px 12px;border:1px solid var(--line);
  border-radius:8px;background:var(--panel);color:var(--ink);font-size:15px;box-shadow:var(--shadow)}
input[type=search]:focus{outline:2px solid var(--accent);outline-offset:-1px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:7px 11px;border:1px solid var(--line);border-radius:999px;background:var(--panel);
  color:var(--dim);font-size:13px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.count{color:var(--dim);font-size:13px;margin:14px 0 10px}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.card{display:flex;gap:11px;align-items:center;background:var(--panel);border:1px solid var(--line);
  border-left-width:3px;border-radius:9px;padding:9px 11px;box-shadow:var(--shadow);cursor:pointer}
.card.iron{border-left-color:var(--iron)} .card.steel{border-left-color:var(--steel)}
.ic{width:42px;height:42px;flex:none;display:grid;place-items:center;
  background:rgba(128,128,128,.10);border-radius:7px}
.ic img{max-width:38px;max-height:38px;image-rendering:pixelated}
.ic .q{color:var(--dim);font-size:17px}
.t{min-width:0;flex:1}
.nm{font-weight:600;font-size:14px;line-height:1.3;overflow-wrap:anywhere}
.meta{color:var(--dim);font-size:11.5px;margin-top:3px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tag{border:1px solid var(--line);border-radius:4px;padding:0 5px;font-size:10.5px;white-space:nowrap}
.u{color:var(--accent);font-weight:700}
.mod{color:var(--accent)}
.none{color:var(--dim);padding:32px 0;text-align:center}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin:0 0 4px;font-size:12.5px;color:var(--dim)}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:-1px;margin-right:5px}
@media (max-width:520px){ .grid{grid-template-columns:1fr} h1{font-size:18px} }
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Objets fondables</h1>
  <p class="sub">Au fourneau. Le creuset se remplit fonte après fonte, capacité 20 unités.</p>
  <div class="controls">
    <input type="search" id="q" placeholder="Rechercher un objet..." autocomplete="off" spellcheck="false">
    <div class="chips" id="fm">
      <button class="chip" data-m="" aria-pressed="true">Tous métaux</button>
      <button class="chip" data-m="iron" aria-pressed="false">Fer</button>
      <button class="chip" data-m="steel" aria-pressed="false">Acier</button>
    </div>
  </div>
  <div class="chips" id="fs" style="margin-top:8px">
    <button class="chip" data-s="" aria-pressed="true">Toutes tailles</button>
    <button class="chip" data-s="smaller" aria-pressed="false">Très petit</button>
    <button class="chip" data-s="small" aria-pressed="false">Petit</button>
    <button class="chip" data-s="medium" aria-pressed="false">Moyen</button>
    <button class="chip" data-s="mediumplus" aria-pressed="false">Moyen +</button>
    <button class="chip" data-s="large" aria-pressed="false">Grand</button>
  </div>
</header>
<p class="legend">
  <span><span class="sw" style="background:var(--iron)"></span>Fer</span>
  <span><span class="sw" style="background:var(--steel)"></span>Acier</span>
  <span>Clic sur une carte pour copier l'identifiant</span>
</p>
<div class="count" id="count"></div>
<div class="grid" id="grid"></div>
<div class="none" id="none" hidden>Aucun objet ne correspond.</div>
</div>

<script>
const D=JSON.parse(document.getElementById('data').textContent);
const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
D.forEach(d=>d._k=norm(d.n+' '+d.id+' '+(d.mod||'')));
let fm='',fs='',q='';
const grid=document.getElementById('grid'),cnt=document.getElementById('count'),non=document.getElementById('none');
function card(d){
  const ic=d.i?`<img src="${d.i}" alt="" loading="lazy">`:'<span class="q">?</span>';
  const u=d.s==='smaller'?`<span class="u">×${d.coef}</span> vers 10`:`<span class="u">${d.u}</span> unité${d.u>1?'s':''}`;
  return `<div class="card ${d.m}" data-id="${d.id}" title="${d.id}">
   <div class="ic">${ic}</div>
   <div class="t"><div class="nm">${d.n}</div>
   <div class="meta"><span class="tag">${d.sl}</span>${u}<span class="tag">${d.c} charbon</span>${d.mod?`<span class="mod">${d.mod}</span>`:''}</div>
   </div></div>`;
}
function render(){
  const nq=norm(q);
  const r=D.filter(d=>(!fm||d.m===fm)&&(!fs||d.s===fs)&&(!nq||d._k.includes(nq)));
  grid.innerHTML=r.map(card).join('');
  non.hidden=r.length>0;
  cnt.textContent=`${r.length} objet${r.length>1?'s':''} sur ${D.length}`;
}
document.getElementById('q').addEventListener('input',e=>{q=e.target.value;render()});
function chips(id,set){
  document.getElementById(id).addEventListener('click',e=>{
    const b=e.target.closest('.chip'); if(!b)return;
    [...b.parentNode.children].forEach(c=>c.setAttribute('aria-pressed',c===b));
    set(b.dataset.m!==undefined?b.dataset.m:b.dataset.s); render();
  });
}
chips('fm',v=>fm=v); chips('fs',v=>fs=v);
grid.addEventListener('click',e=>{
  const c=e.target.closest('.card'); if(!c)return;
  navigator.clipboard?.writeText(c.dataset.id);
  const n=c.querySelector('.nm'),o=n.textContent;
  n.textContent='Identifiant copié'; setTimeout(()=>n.textContent=o,900);
});
render();
</script>
</body>
