<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carte PZ together</title>
<link rel="icon" href="favicon.ico">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#14161a">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="pwa/icone-192.png">
<link rel="stylesheet" href="carte/style.css?v=8">
</head>
<body>

<div id="carte">
  <div id="plan"></div>
  <canvas id="constructions"></canvas>
  <canvas id="rues"></canvas>
  <div id="marqueurs"></div>
</div>

<button id="replier" title="Replier ou deplier le panneau">&#9776;</button>
<button id="bascule" hidden title="Changer de vue (touche V)">vue isometrique</button>

<div id="hud">
  <div class="coord">x <b id="hudX">-</b> &nbsp; y <b id="hudY">-</b></div>
  <div class="detail" id="hudZoom">-</div>
  <div class="detail" id="hudCompte">-</div>
</div>

<div id="panneau">
  <h1>Carte PZ together</h1>

  <div class="bloc">
    <div id="filtres"></div>
    <div class="ligne-boutons">
      <button id="toutCocher">Tout</button>
      <button id="rienCocher">Rien</button>
      <button id="voirTout">Tout voir</button>
      <button id="slugger">Slugger</button>
    </div>
    <label class="case-calque">
      <input type="checkbox" id="calqueRues"> noms de rues
    </label>
    <label class="case-calque" id="labelConstructions" hidden>
      <input type="checkbox" id="calqueConstructions"> mes constructions
      <i class="nb" id="nbConstructions"></i>
    </label>
  </div>

  <div class="bloc" id="blocLoot">
    <div class="ligne-loot">
      <span class="etiquette">repop</span>
      <input type="text" id="repopJeu" inputmode="decimal" title="Delai de repop, en heures de JEU">
      <span class="unite">h de jeu</span>
      <span id="repopReel" class="reel"></span>
    </div>
    <div class="ligne-loot">
      <span id="lootCompte" class="reel"></span>
      <button id="lootReset" title="Effacer tous les chronos">tout effacer</button>
    </div>
  </div>

  <div class="bloc">
    <div class="ligne-boutons" style="margin-top:0">
      <input type="text" id="coordX" placeholder="x" inputmode="numeric">
      <input type="text" id="coordY" placeholder="y" inputmode="numeric">
      <button id="allerCoord">Aller</button>
    </div>
    <div class="ligne-boutons">
      <select id="villes"><option value="">aller a une ville moddee...</option></select>
    </div>
  </div>

  <div id="liste"></div>
</div>

<script type="module" src="carte/app.js?v=17"></script>
</body>
</html>
